[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ftv-api"
version = "0.1.0"
description = "FastAPI stub that returns a mocked 6-month change in player market value."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "httpx>=0.27",
]

[project.scripts]
ftv-api = "ftv_api.main:main"

[tool.setuptools.packages.find]
where = ["src"]
