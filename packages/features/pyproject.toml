[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ftv-features"
version = "0.1.0"
description = "Player identity schema and feature-store stubs for the transfer-value predictor."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10",
]

[tool.setuptools.packages.find]
where = ["src"]
