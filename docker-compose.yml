# Optional local Postgres for the feature-store schema.
# The API stub and the dashboard do not require it.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ftv
      POSTGRES_PASSWORD: ftv
      POSTGRES_DB: ftv
    ports:
      - "5432:5432"
    volumes:
      - ftv_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ftv -d ftv"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ftv_pg:
